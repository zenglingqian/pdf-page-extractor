name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 描述你遇到的问题或需求场景
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望软件如何实现该功能
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他替代方案
    validations:
      required: false
