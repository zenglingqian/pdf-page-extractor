name: Bug 报告
description: 报告软件缺陷或异常行为
title: "[Bug] "
labels: bug
body:
  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 窗口标题中显示的版本号，或 exe 文件属性中的版本
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请详细描述如何复现该问题
      placeholder: |
        1. 打开软件并加载 xxx.pdf
        2. 输入范围 ...
        3. 点击提取
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / 实际行为
      description: 期望发生什么？实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: attachment
    attributes:
      label: 附件与截图
      description: 错误提示截图、可复现的 PDF 样本（请去除敏感内容）
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: "Windows 10 22H2 / Windows 11"
    validations:
      required: true
